name: Build from zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the uploaded zip
        run: |
          if ls *.zip >/dev/null 2>&1; then
            unzip -o *.zip
            cp -r hands-off-assistant/. .
            rm -rf hands-off-assistant *.zip
            git config user.email "actions@github.com"
            git config user.name "github-actions"
            git add -A
            git commit -m "Unpack the project" || true
            git push origin HEAD:main || true
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build the APK
        if: hashFiles('app/build.gradle.kts') != ''
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Keep the APK on the run page
        if: hashFiles('app/build/outputs/apk/debug/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: vaani-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish the APK
        if: hashFiles('app/build/outputs/apk/debug/*.apk') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk vaani-debug.apk
          gh release create v3.5.0 --repo "$REPO" --title "Vaani v3.5.0" \
            --notes "Built from the uploaded zip." vaani-debug.apk 2>/dev/null \
          || gh release upload v3.5.0 --repo "$REPO" vaani-debug.apk --clobber
